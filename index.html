<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinRAR License Manager — DTrix</title>
  <link rel="stylesheet" href="docs/style.css">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.2);
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 32px var(--accent-glow);
      text-align: center;
    }
    .banner {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #8b949e;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .cmd-box {
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      text-align: left;
    }
    .cmd-text {
      color: var(--cyan);
      font-family: Consolas, monospace;
      font-size: 13px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .copy-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .copy-btn:hover { opacity: 0.85; }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #238636;
      color: #fff;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #30363d; }
  </style>
</head>
<body>
  <div class="container">
    <img src="files/preview.png" alt="WinRAR License Manager" class="banner">
    <h1>Kích Hoạt WinRAR Bản Quyền</h1>
    <p>Giải pháp kích hoạt WinRAR an toàn, minh bạch 100%. Không can thiệp file hệ thống, không chứa mã độc.</p>

    <div class="cmd-box">
      <code class="cmd-text" id="cmd">irm https://raw.githubusercontent.com/dat1799/DTrix-Winrar-License-Releases/main/activate.ps1 | iex</code>
      <button class="copy-btn" onclick="copyCmd()">Sao chép</button>
    </div>

    <div class="btn-group">
      <a href="rarreg.key" download class="btn btn-primary">⬇️ Tải rarreg.key thủ công</a>
      <a href="https://github.com/dat1799/DTrix-Winrar-License-Releases" class="btn btn-secondary">Xem trên GitHub</a>
    </div>
  </div>

  <script>
    function copyCmd() {
      const text = document.getElementById('cmd').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Đã sao chép!';
        setTimeout(() => btn.textContent = 'Sao chép', 2000);
      });
    }
  </script>
</body>
</html>
